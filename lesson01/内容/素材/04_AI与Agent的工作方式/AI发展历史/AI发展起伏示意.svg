<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="580" viewBox="0 0 1460 580" role="img" aria-labelledby="title desc">
<title id="title">人工智能的发展：热潮与寒冬</title>
<desc id="desc">中文定性示意曲线：早期热潮后进入1974至1980年第一次寒冬，专家系统兴起后进入1987至1993年第二次寒冬，随后数据驱动方法与深度学习推动复苏，2022年底ChatGPT发布后进入生成式AI热潮。曲线不是统计数据。</desc>
<rect width="1460" height="580" fill="#fafbfc"/>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" fill="#172b4d">
<text x="60" y="52" font-size="30" font-weight="700">人工智能的发展：热潮与寒冬</text>
<text x="60" y="84" font-size="17" fill="#536478">关注与投入的变化示意 · 1956 年以来</text>
<rect x="320" y="125" width="130" height="315" rx="12" fill="#e5eff8"/>
<rect x="660" y="125" width="135" height="315" rx="12" fill="#e5eff8"/>
<path d="M85 125 V440 H1410" fill="none" stroke="#8694a5" stroke-width="2"/>
<text x="90" y="113" font-size="16" fill="#536478">关注与投入</text>
<text x="45" y="157" font-size="15">高</text><text x="45" y="431" font-size="15">低</text>
<path d="M100 350 C145 325 165 225 235 210 S320 365 380 380 S475 235 550 205 S655 365 725 385 S830 320 875 280 S975 235 1020 165 S1080 150 1120 145 C1190 145 1200 110 1260 90 S1340 60 1400 45" fill="none" stroke="#177b78" stroke-width="5" stroke-linecap="round"/>
<g fill="#177b78"><circle cx="235" cy="210" r="6"/><circle cx="380" cy="380" r="6"/><circle cx="550" cy="205" r="6"/><circle cx="725" cy="385" r="6"/><circle cx="1020" cy="165" r="6"/><circle cx="1260" cy="90" r="6"/></g>
<g text-anchor="middle">
<text x="230" y="155" font-size="21" font-weight="700">早期热潮</text><text x="230" y="182" font-size="16">逻辑推理与问题求解</text>
<text x="385" y="265" font-size="20" font-weight="700">第一次寒冬</text><text x="385" y="293" font-size="16">预期超过实际能力</text><text x="385" y="319" font-size="16">经费与关注下降</text>
<text x="550" y="151" font-size="21" font-weight="700">专家系统兴起</text><text x="550" y="179" font-size="16">知识应用带来新热潮</text>
<text x="727" y="265" font-size="20" font-weight="700">第二次寒冬</text><text x="727" y="293" font-size="16">商业受挫</text><text x="727" y="319" font-size="16">维护成本高</text>
<text x="875" y="354" font-size="20" font-weight="700">逐步复苏</text><text x="875" y="382" font-size="16">数据与算力增长</text>
<text x="1030" y="215" font-size="21" font-weight="700">深度学习突破</text><text x="1030" y="243" font-size="16">新一轮关注与投入</text>
<text x="1290" y="200" font-size="21" font-weight="700">生成式 AI 热潮</text><text x="1290" y="230" font-size="16">2022 年底 ChatGPT 发布</text><text x="1290" y="258" font-size="16">公众关注与应用迅速增长</text>
<g font-size="16" fill="#536478"><text x="110" y="469">1956</text><text x="385" y="469">1974—1980</text><text x="550" y="469">1980—1987</text><text x="727" y="469">1987—1993</text><text x="885" y="469">1993—2011</text><text x="1055" y="469">2012 年起</text><text x="1290" y="469">2022 年底以来</text></g>
</g>
</g></svg>
