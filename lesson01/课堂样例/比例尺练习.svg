<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 190" role="img" aria-labelledby="title desc">
  <title id="title">比例尺换算教学示意</title>
  <desc id="desc">长度为 100 个图像像素的比例尺对应 10 微米；另一条测量线长度为 30 个图像像素。</desc>
  <rect width="420" height="190" fill="#ffffff"/>
  <text x="30" y="35" font-family="sans-serif" font-size="18" fill="#223344">比例尺换算教学示意</text>
  <line x1="55" y1="85" x2="155" y2="85" stroke="#155e75" stroke-width="5"/>
  <line x1="55" y1="76" x2="55" y2="94" stroke="#155e75" stroke-width="3"/>
  <line x1="155" y1="76" x2="155" y2="94" stroke="#155e75" stroke-width="3"/>
  <text x="178" y="91" font-family="sans-serif" font-size="15" fill="#223344">100 px 对应 10 μm</text>
  <line x1="55" y1="139" x2="85" y2="139" stroke="#c2410c" stroke-width="5"/>
  <line x1="55" y1="130" x2="55" y2="148" stroke="#c2410c" stroke-width="3"/>
  <line x1="85" y1="130" x2="85" y2="148" stroke="#c2410c" stroke-width="3"/>
  <text x="108" y="145" font-family="sans-serif" font-size="15" fill="#223344">30 px 对应多少 μm？</text>
</svg>
